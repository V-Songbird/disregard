<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disregard</title>
<meta name="description" content="Paste one rule from an agent instruction file. Disregard says which lines are not rules and which ones should be hooks.">
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js"></script>
</head>
<body>
<main>
  <div class="topbar">
    <h1 data-i18n="title">Disregard</h1>
    <p class="picker">
      <label for="ui-lang" data-i18n="uiLang">Interface language</label>
      <select id="ui-lang"></select>
    </p>
  </div>
  <p class="lede" data-i18n="lede"></p>

  <form id="ask" novalidate>
    <label for="rule" data-i18n="ruleLabel"></label>
    <p class="hint" id="rule-hint" data-i18n="ruleHint"></p>
    <textarea id="rule" name="rule" dir="auto" aria-describedby="rule-hint rule-count" autocomplete="off"
      placeholder="Always try to use functional components."></textarea>
    <div class="row">
      <button type="submit" id="go" data-i18n="submit"></button>
      <span class="count" id="rule-count"></span>
    </div>
  </form>

  <p class="promise" id="promise"></p>

  <section id="out" aria-live="polite" aria-busy="false"></section>
</main>

<footer>
  <span data-i18n="footer"></span>
  <a href="/privacy" data-i18n="privacy"></a> · <a href="/terms" data-i18n="terms"></a>
</footer>

<script>
(() => {
  "use strict";

  // Matches MAX_RULE_CHARS in lib/analyze.js. The server is the one that
  // enforces it; this only saves a round trip.
  const MAX = 2000;

  // The findings nobody else can make. They get the accent border.
  const LEAD = new Set(["not_a_rule", "should_be_a_hook", "could_be_a_hook",
    "belongs_as_a_skill", "belongs_as_a_subagent"]);

  const form = document.getElementById("ask");
  const input = document.getElementById("rule");
  const go = document.getElementById("go");
  const count = document.getElementById("rule-count");
  const out = document.getElementById("out");
  const picker = document.getElementById("ui-lang");

  const LOCALES = Object.keys(window.STRINGS);
  let t = window.STRINGS.en;

  // The last answer, kept so switching language re-renders it rather than
  // clearing the screen under the reader.
  let last = null;

  // The reader's own language if we speak it, else English. A stored choice
  // wins, because someone who picked once meant it.
  function initialLocale() {
    try {
      const saved = localStorage.getItem("disregard.lang");
      if (saved && window.STRINGS[saved]) return saved;
    } catch { /* private mode, or storage blocked */ }
    for (const tag of navigator.languages || [navigator.language || "en"]) {
      const code = String(tag).toLowerCase().split("-")[0];
      if (window.STRINGS[code]) return code;
    }
    return "en";
  }

  const fill = (s, vars) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));

  const el = (tag, className, text) => {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  function applyLocale(code) {
    t = window.STRINGS[code];
    document.documentElement.lang = code;
    document.documentElement.dir = t.dir;
    document.title = t.title;
    for (const node of document.querySelectorAll("[data-i18n]")) {
      node.textContent = t[node.dataset.i18n];
    }
    const promise = document.getElementById("promise");
    const link = el("a", null, t.promiseLink);
    link.href = "/privacy";
    promise.replaceChildren(document.createTextNode(t.promiseA), link, document.createTextNode(t.promiseB));
    updateCount();
    if (last) render(last);
    try { localStorage.setItem("disregard.lang", code); } catch { /* nothing to do */ }
  }

  function updateCount() {
    const n = input.value.length;
    count.textContent = fill(t.counter, { n: n, max: MAX });
    count.classList.toggle("over", n > MAX);
    go.disabled = n > MAX;
  }

  // Everything below writes with textContent. The `echo` field hands back text
  // a stranger pasted, and a refused rule is by definition one that was trying
  // something.
  function banner(title, body, echo) {
    const box = el("div", "banner");
    box.append(el("strong", null, title));
    if (body) box.append(el("p", null, body));
    if (echo) {
      const q = el("blockquote", "echo", echo);
      q.dir = "auto";
      box.append(q);
    }
    return box;
  }

  // A finding says what is wrong, why it matters, and what to do about it. The
  // factor and its number stay behind the "what was measured" disclosure:
  // someone about to rewrite a rule needs the fix, not the arithmetic that
  // found it, and a bare "F8 0.8" is a number they have to interpret for us.
  function findingCard(f) {
    const copy = t.findings[f.id];
    if (!copy) return null;
    const vars = { verb: f.verb };
    const li = el("li", LEAD.has(f.id) ? "finding lead" : "finding");
    li.append(el("h2", null, copy.h), el("p", null, fill(copy.d, vars)));
    if (copy.fix) li.append(el("p", "fix", fill(copy.fix, vars)));
    return li;
  }

  function factorList(factors) {
    const box = el("details");
    box.append(el("summary", null, t.measured));
    const dl = el("dl", "factors");
    for (const key of ["is_rule", "F3", "F8", "F1", "F2", "F7"]) {
      if (factors[key] === undefined) continue;
      dl.append(el("dt", null, t.factors[key]), el("dd", null, String(factors[key])));
    }
    if (factors.primitive) {
      const name = t.primitives[factors.primitive.choice] || factors.primitive.choice;
      dl.append(el("dt", null, t.factors.primitive),
        el("dd", null, name + " (" + t.confidence + " " + factors.primitive.confidence + ")"));
    }
    box.append(dl);
    return box;
  }

  function render(body) {
    last = body;
    out.replaceChildren();

    if (body.status === "not_english") {
      const code = body.language && body.language.code;
      const lang = (code && t.languages[code]) || (body.language && body.language.name);
      out.append(banner(t.notEnglishTitle,
        lang ? fill(t.notEnglishBody, { lang: lang }) : t.notEnglishUnknown));
      return;
    }

    if (body.status === "refused" || body.status === "review") {
      const refused = body.status === "refused";
      out.append(banner(refused ? t.refusedTitle : t.reviewTitle,
        refused ? t.refusedBody : t.reviewBody, body.echo));
      return;
    }

    if (body.findings.length === 0) {
      out.append(banner(t.cleanTitle, t.cleanBody));
    } else {
      const list = el("ul", "findings");
      for (const f of body.findings) {
        const card = findingCard(f);
        if (card) list.append(card);
      }
      out.append(list);
    }
    out.append(factorList(body.factors || {}));
  }

  function showError(code) {
    last = null;
    out.replaceChildren(banner(t.errorTitle, fill(t.errors[code] || t.errors.failed, { max: MAX })));
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const rule = input.value.trim();
    if (!rule) {
      last = null;
      out.replaceChildren(banner(t.emptyTitle, t.emptyBody));
      input.focus();
      return;
    }

    go.disabled = true;
    go.textContent = t.submitBusy;
    out.setAttribute("aria-busy", "true");
    last = null;
    out.replaceChildren(banner(t.busyTitle, t.busyBody));

    try {
      const res = await fetch("/api/score", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rule: rule }),
      });
      const body = await res.json();
      if (res.ok) render(body);
      else showError(body.code);
    } catch {
      showError("network");
    } finally {
      go.disabled = false;
      go.textContent = t.submit;
      out.setAttribute("aria-busy", "false");
      updateCount();
    }
  });

  // Ctrl/Cmd+Enter submits, which is what anyone pasting into a textarea tries.
  input.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === "Enter") form.requestSubmit();
  });

  input.addEventListener("input", updateCount);

  for (const code of LOCALES) {
    const option = el("option", null, window.STRINGS[code].label);
    option.value = code;
    picker.append(option);
  }
  picker.addEventListener("change", () => applyLocale(picker.value));

  picker.value = initialLocale();
  applyLocale(picker.value);
})();
</script>
</body>
</html>
