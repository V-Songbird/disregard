<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disregard — review your CLAUDE.md and AGENTS.md instructions</title>
<meta name="description" content="Review a CLAUDE.md, an AGENTS.md or one rule, then copy an evidence-based refactoring prompt for your AI agent.">
<link rel="canonical" href="https://disregard.dev/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Disregard">
<meta property="og:url" content="https://disregard.dev/">
<meta property="og:title" content="Disregard — review your CLAUDE.md and AGENTS.md instructions">
<meta property="og:description" content="Paste or drop your CLAUDE.md or AGENTS.md and get a prompt your agent can use to improve it.">
<meta property="og:image" content="https://disregard.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Disregard: paste or drop your CLAUDE.md or AGENTS.md and get a prompt your agent can use to improve it. Below, a sample instruction line with one finding.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Disregard","url":"https://disregard.dev/"}</script>
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js"></script>
<script src="/file-i18n.js"></script>
<script src="/vendor/commonmark-0.31.2.min.js"></script>
<script src="/document-model.js"></script>
<script src="/refactor-prompt.js"></script>
<script src="/review-ui.js"></script>
</head>
<body>
<main>
  <div class="topbar">
    <h1 data-i18n="title">Disregard</h1>
    <p class="picker">
      <label for="ui-lang" data-i18n="uiLang">Interface language</label>
      <select id="ui-lang"></select>
    </p>
  </div>
  <p class="hint" id="ai-note" data-i18n="aiTranslated"></p>
  <p class="lede" data-i18n="lede"></p>

  <div class="mode-picker" role="group" id="input-mode">
    <button type="button" id="mode-file" aria-pressed="true" aria-controls="file-panel"></button>
    <button type="button" id="mode-rule" aria-pressed="false" aria-controls="rule-panel"></button>
  </div>
  <section id="file-panel"></section>

  <section id="rule-panel" hidden>
  <form id="ask" novalidate>
    <label for="rule" data-i18n="ruleLabel"></label>
    <p class="hint" id="rule-hint" data-i18n="ruleHint"></p>
    <textarea id="rule" name="rule" dir="auto" aria-describedby="rule-hint rule-count" autocomplete="off"
      placeholder="Always try to use functional components."></textarea>
    <div class="row">
      <button type="submit" id="go" data-i18n="submit" aria-describedby="rule-consent"></button>
      <button type="button" id="rule-cancel" class="secondary" hidden></button>
      <span class="count" id="rule-count"></span>
    </div>
    <p class="hint" id="rule-consent"></p>
  </form>

  <section id="out" aria-live="polite" aria-busy="false"></section>
  </section>

  <p class="promise" id="promise"></p>
</main>

<footer>
  <span data-i18n="footer"></span>
  <a href="/research" data-i18n="research"></a> · <a href="/privacy" data-i18n="privacy"></a> · <a href="/terms" data-i18n="terms"></a>
</footer>

<script>
(() => {
  "use strict";

  // Matches MAX_RULE_CHARS in lib/analyze.js. The server is the one that
  // enforces it; this only saves a round trip.
  const MAX = 2000;
  // The server gives its provider 30 seconds. Leave room for the round trip,
  // then release the form even if the connection never returns a response.
  const REQUEST_TIMEOUT_MS = 35000;

  // Leading finding categories use the accent border.
  const LEAD = new Set(["not_a_rule", "should_be_a_hook", "could_be_a_hook",
    "belongs_as_a_skill", "belongs_as_a_subagent"]);

  const form = document.getElementById("ask");
  const input = document.getElementById("rule");
  const go = document.getElementById("go");
  const cancel = document.getElementById("rule-cancel");
  const count = document.getElementById("rule-count");
  const out = document.getElementById("out");
  const picker = document.getElementById("ui-lang");

  const LOCALES = Object.keys(window.STRINGS);
  let t = window.STRINGS.en;

  // Retain every display state so locale changes also translate errors and
  // pending/empty messages. A request owns the field until it settles or the
  // reader stops it; a stopped request's response never renders.
  let view = { kind: "idle" };
  let pending = false;
  let request = null;
  let reviewUI;

  // The reader's own language if we speak it, else English. A stored choice
  // wins, because someone who picked once meant it.
  function initialLocale() {
    try {
      const saved = localStorage.getItem("disregard.lang");
      if (saved && Object.hasOwn(window.STRINGS, saved)) return saved;
    } catch { /* private mode, or storage blocked */ }
    // The Chinese strings are Simplified. A Traditional tag does not select
    // them, and neither does a bare zh listed after one.
    let traditional = false;
    for (const tag of navigator.languages || [navigator.language || "en"]) {
      const lower = String(tag).toLowerCase();
      if (/^zh-(hant|tw|hk|mo)(-|$)/.test(lower)) { traditional = true; continue; }
      if (traditional && lower === "zh") continue;
      const code = lower.split("-")[0];
      if (Object.hasOwn(window.STRINGS, code)) return code;
    }
    return "en";
  }

  const fill = (s, vars) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));

  // A key the server sent indexes a translation table only when the table
  // defines it itself, so an inherited name such as "constructor" takes the fallback.
  const own = (table, key) => (Object.hasOwn(table, key) ? table[key] : undefined);

  // Displayed numbers share the file review's format for the page language. Without
  // review-ui.js, the same format: Latin digits, String()'s digits and decimals, no grouping.
  const review = window.DisregardReview;
  const number = review ? review.number : (value) => typeof value !== "number" ? String(value) :
    new Intl.NumberFormat(document.documentElement.lang, { numberingSystem: "latn", useGrouping: false, maximumFractionDigits: 20 }).format(value);

  const el = (tag, className, text) => {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  // Without review-ui.js the single-rule prompt is unavailable, as when its prompt script fails.
  const promptPanel = review ? review.promptPanel : (report, strings) => {
    const panel = el("section", "prompt-panel");
    panel.append(el("p", "hint", strings.unavailable));
    return panel;
  };

  // Without review-ui.js no file can be read: file mode says so and sends nothing.
  function unavailableReview({ host }) {
    const error = el("p", "file-error"); error.id = "file-error"; error.setAttribute("role", "alert");
    host.append(error);
    return { refresh() { error.textContent = t.file.parser_unavailable; } };
  }

  // The page owns the file/rule mode switch, so it works with or without review-ui.js. A
  // request running in either mode holds the switch until it settles.
  const modeFile = document.getElementById("mode-file"), modeRule = document.getElementById("mode-rule");
  const filePanel = document.getElementById("file-panel"), rulePanel = document.getElementById("rule-panel");
  let mode = "file", fileBusy = false;

  function modeControls() {
    modeFile.textContent = t.file.fileMode; modeRule.textContent = t.file.ruleMode;
    document.getElementById("input-mode").setAttribute("aria-label", t.file.modeLabel);
    modeFile.setAttribute("aria-pressed", String(mode === "file"));
    modeRule.setAttribute("aria-pressed", String(mode === "rule"));
    modeFile.disabled = modeRule.disabled = pending || fileBusy;
    filePanel.hidden = mode !== "file"; rulePanel.hidden = mode !== "rule";
  }

  for (const [button, next] of [[modeFile, "file"], [modeRule, "rule"]]) {
    button.addEventListener("click", () => { if (!pending && !fileBusy) { mode = next; modeControls(); } });
  }

  function applyLocale(code) {
    t = window.STRINGS[code];
    // The attribute names the variety and script the strings are written in;
    // translation lookup and the stored choice keep the short key.
    document.documentElement.lang = { es: "es-MX", zh: "zh-Hans" }[code] || code;
    document.documentElement.dir = t.dir;
    document.title = t.pageTitle;
    for (const node of document.querySelectorAll("[data-i18n]")) {
      node.textContent = t[node.dataset.i18n];
    }
    // English is the source; every other locale was machine-translated.
    document.getElementById("ai-note").hidden = !t.aiTranslated;
    document.getElementById("promise").textContent = t.promiseA;
    // What pressing the button sends is said once, next to it.
    const link = el("a", null, t.promiseLink);
    link.href = "/privacy";
    const [before, after = ""] = t.ruleConsent.split("{link}");
    document.getElementById("rule-consent").replaceChildren(document.createTextNode(before), link, document.createTextNode(after));
    updateCount();
    renderView();
    reviewUI?.refresh();
  }

  function updateCount() {
    const n = input.value.length;
    count.textContent = fill(t.counter, { n: number(n), max: number(MAX) });
    count.classList.toggle("over", n > MAX);
    go.disabled = pending || n > MAX;
    go.textContent = pending ? t.submitBusy : t.submit;
    cancel.hidden = !pending;
    cancel.textContent = t.file.cancel;
    input.readOnly = pending;
    out.setAttribute("aria-busy", String(pending));
    modeControls();
  }

  // Everything below writes with textContent. The `echo` field hands back text
  // a stranger pasted, and a refused rule is by definition one that was trying
  // something.
  function banner(title, body, echo) {
    const box = el("div", "banner");
    box.append(el("strong", null, title));
    if (body) box.append(el("p", null, body));
    if (echo) {
      const q = el("blockquote", "echo", echo);
      q.dir = "auto";
      box.append(q);
    }
    return box;
  }

  // A finding says what is wrong, why it matters, and what to do about it. The
  // factor and its number stay behind the "what was measured" disclosure:
  // someone about to rewrite a rule needs the fix, not the arithmetic that
  // found it, and a bare "F8 0.8" is a number they have to interpret for us.
  function findingCard(f) {
    const copy = own(t.findings, f.id);
    if (!copy) return null;
    const vars = { verb: f.verb };
    const li = el("li", LEAD.has(f.id) ? "finding lead" : "finding");
    li.append(el("h2", null, copy.h), el("p", null, fill(copy.d, vars)));
    if (copy.fix) li.append(el("p", "fix", fill(copy.fix, vars)));
    return li;
  }

  // Each factor label names its scale; the bounds render through number() like the values.
  const SCALES = { F3: [0, 4], F8: [0, 3], F1: [0, 1], F2: [0, 1], F7: [0, 1] };

  function factorList(factors) {
    const box = el("details");
    box.append(el("summary", null, t.measured));
    const dl = el("dl", "factors");
    for (const key of ["is_rule", "F3", "F8", "F1", "F2", "F7", "specificity"]) {
      if (factors[key] === undefined) continue;
      const value = factors[key] === null ? t.undetermined : number(factors[key]);
      const label = SCALES[key] ? fill(t.factors[key], { min: number(SCALES[key][0]), max: number(SCALES[key][1]) }) : t.factors[key];
      dl.append(el("dt", null, label), el("dd", null, value));
    }
    if (factors.rule_role) {
      const role = own(t.ruleRoles, factors.rule_role.choice) || factors.rule_role.choice;
      dl.append(el("dt", null, t.factors.rule_role),
        el("dd", null, fill(t.confidence, { choice: role, value: number(factors.rule_role.confidence) })));
    }
    if (factors.primitive) {
      const name = own(t.primitives, factors.primitive.choice) || factors.primitive.choice;
      dl.append(el("dt", null, t.factors.primitive),
        el("dd", null, fill(t.confidence, { choice: name, value: number(factors.primitive.confidence) })));
    }
    box.append(dl);
    return box;
  }

  function render(body) {
    out.replaceChildren();

    if (body.status === "not_english") {
      const code = body.language && body.language.code;
      const lang = (code && own(t.languages, code)) || (body.language && body.language.name);
      out.append(banner(t.notEnglishTitle,
        lang ? fill(t.notEnglishBody, { lang: lang }) : t.notEnglishUnknown));
      return;
    }

    if (body.status === "refused" || body.status === "review") {
      const refused = body.status === "refused";
      out.append(banner(refused ? t.refusedTitle : t.reviewTitle,
        refused ? t.refusedBody : t.reviewBody, body.echo));
      return;
    }

    if (body.findings.length === 0) {
      out.append(banner(t.cleanTitle, t.cleanBody));
    } else {
      const list = el("ul", "findings");
      for (const f of body.findings) {
        const card = findingCard(f);
        if (card) list.append(card);
      }
      out.append(list);
    }
    out.append(factorList(body.factors || {}));
    if (view.rule) out.append(promptPanel({
      schemaVersion: 1, sourceName: "Instruction excerpt (source file not provided)", sourceText: view.rule,
      units: [{ id: "rule", startLine: 1, endLine: view.rule.split(/\r\n|\r|\n/).length,
        startOffset: 0, endOffset: view.rule.length, rawText: view.rule, rule: view.rule,
        context: [], state: "ok", result: body }],
    }, t.file));
  }

  function renderView() {
    if (view.kind === "result") render(view.body);
    else if (view.kind === "busy") out.replaceChildren(banner(t.busyTitle, t.busyBody));
    else if (view.kind === "stopped") out.replaceChildren(banner(t.stoppedTitle, t.stoppedBody));
    else if (view.kind === "empty") out.replaceChildren(banner(t.emptyTitle, t.emptyBody));
    else if (view.kind === "error") {
      out.replaceChildren(banner(t.errorTitle, fill(own(t.errors, view.code) || t.errors.failed, { max: number(MAX) })));
    } else out.replaceChildren();
  }

  function showView(next) {
    view = next;
    renderView();
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    // requestSubmit() and keyboard shortcuts can bypass a disabled button.
    if (pending) return;
    const submitted = input.value;
    const rule = submitted.trim();
    if (submitted.length > MAX) {
      showView({ kind: "error", code: "too_long" });
      input.focus();
      return;
    }
    if (!rule) {
      showView({ kind: "empty" });
      input.focus();
      return;
    }

    // Disabling the focused button moves focus to the document in Chromium, so
    // the stop control takes it for the request. Return it to the submit button
    // afterwards only if the reader has not moved elsewhere.
    let restoreSubmitFocus = document.activeElement === go;
    const current = request = { controller: new AbortController(), stopped: false };
    pending = true;
    updateCount();
    showView({ kind: "busy" });
    if (restoreSubmitFocus) cancel.focus();
    const preserveReaderFocus = () => { restoreSubmitFocus = false; };
    if (restoreSubmitFocus) {
      document.addEventListener("pointerdown", preserveReaderFocus, { once: true });
      document.addEventListener("focusin", preserveReaderFocus, { once: true });
    }
    const timeout = setTimeout(() => current.controller.abort(), REQUEST_TIMEOUT_MS);

    try {
      const res = await fetch("/api/score", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rule: rule }),
        signal: current.controller.signal,
      });
      const body = await res.json();
      // A stopped request never renders, even when its response still arrives.
      if (current.stopped) return;
      // Also discard responses after a programmatic edit of the read-only field.
      if (input.value !== submitted) showView({ kind: "idle" });
      else if (res.ok) showView({ kind: "result", body, rule });
      else showView({ kind: "error", code: body?.code });
    } catch {
      if (current.stopped) return;
      showView(input.value !== submitted ? { kind: "idle" }
        : { kind: "error", code: current.controller.signal.aborted ? "timeout" : "network" });
    } finally {
      clearTimeout(timeout);
      document.removeEventListener("pointerdown", preserveReaderFocus);
      document.removeEventListener("focusin", preserveReaderFocus);
      // Stopping already released the form, and a new request may own it now.
      if (!current.stopped) {
        request = null;
        pending = false;
        updateCount();
        const lost = document.activeElement === document.body || document.activeElement === cancel;
        if (restoreSubmitFocus && document.hasFocus() && lost && !go.disabled) go.focus();
      }
    }
  });

  // Stop abandons the pending request: it aborts the fetch, releases the field
  // and announces the stop once through the live region.
  cancel.addEventListener("click", () => {
    if (!request) return;
    request.stopped = true;
    request.controller.abort();
    request = null;
    pending = false;
    updateCount();
    showView({ kind: "stopped" });
    input.focus();
  });

  // The held Enter that started a request must not stop it; a fresh press still does.
  cancel.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && event.repeat && !event.isComposing) event.preventDefault();
  });

  // Focus may return here before a held Enter is released. Its repeated
  // keydowns are not new submissions; Space and fresh Enter presses stay native.
  go.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && event.repeat && !event.isComposing) event.preventDefault();
  });

  // Ctrl/Cmd+Enter submits once per press, including when a held key outlasts
  // the request. Composition remains the input method's responsibility.
  input.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === "Enter" && !event.isComposing) {
      event.preventDefault();
      if (!event.repeat && !pending) form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    if (!pending) showView({ kind: "idle" });
    updateCount();
  });

  reviewUI = (review ? review.create : unavailableReview)({
    host: filePanel, getStrings: () => t,
    findingCard, factorList, onBusy(value) { fileBusy = value; modeControls(); },
  });

  for (const code of LOCALES) {
    const option = el("option", null, window.STRINGS[code].label);
    option.value = code;
    picker.append(option);
  }
  // Only an explicit pick is saved; the language detected at start-up is not.
  picker.addEventListener("change", () => {
    applyLocale(picker.value);
    try { localStorage.setItem("disregard.lang", picker.value); } catch { /* nothing to do */ }
  });

  picker.value = initialLocale();
  applyLocale(picker.value);
})();
</script>
</body>
</html>
